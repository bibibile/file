<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>aLiu's Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* 全局变量定义 */
:root {
    --text-color: #ffffff;
    --card-bg: rgba(255, 255, 255, 0.12);
    --card-hover: rgba(255, 255, 255, 0.25);
    --fallback-bg: url('https://bing.img.run/1920x1080.php');
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    color: var(--text-color);
    background: var(--fallback-bg) no-repeat center center fixed;
    background-size: cover;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding-bottom: 20px; /* 底部留白 */
}

#bg-video {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    z-index: -10;
    object-fit: cover;
    filter: brightness(0.7);
}

/* --- 1. 顶部信息区域 --- */
.header-info {
    margin-top: 12vh;
    display: flex;
    gap: 15px;
    align-items: center;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    opacity: 0.9;
    animation: fadeIn 1s ease backwards;
}

.weather-badge {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* --- 2. 时钟区域 --- */
.clock-container {
    margin-top: 10px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    text-shadow: 0 5px 20px rgba(0,0,0,0.5);
    animation: dropDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    font-size: 96px; 
    font-weight: 700;
    letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
}

.clock-colon {
    margin: 0 2px;
    position: relative;
    top: -5px;
    opacity: 0.9;
}

.clock-seconds {
    display: inline-block;
    width: 1.25em;
    text-align: left;
}

.tick-anim { animation: slideUpFade 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

.date {
    font-size: 18px;
    opacity: 0.8;
    margin-bottom: 40px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-shadow: 0 2px 5px rgba(0,0,0,0.6);
}

/* --- 3. 搜索框 --- */
.search-container {
    width: 100%;
    max-width: 680px;
    padding: 0 20px;
    margin-bottom: 60px;
    z-index: 1;
    animation: fadeIn 1s ease 0.3s backwards;
}

.search-input {
    width: 100%;
    padding: 18px 30px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
    font-size: 18px;
    outline: none;
    text-align: center;
    transition: all 0.3s ease;
    box-shadow: 0 5px 25px rgba(0,0,0,0.1);
}

.search-input:focus {
    background: rgba(0, 0, 0, 0.6);
    border-color: rgba(255,255,255,0.5);
    transform: scale(1.02);
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

/* --- 4. 图标网格 --- */
.main-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 30px 20px;
    width: 100%;
    max-width: 1000px;
    padding: 0 20px 60px 20px;
    z-index: 1;
    animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s backwards;
}

.app-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #fff;
    cursor: pointer;
}

.app-icon {
    width: 80px;
    height: 80px;
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.4s cubic-bezier(0.3, 1.5, 0.5, 1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
}

.app-card:hover .app-icon {
    transform: translateY(-8px) scale(1.05);
    background: var(--card-hover);
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    border-color: rgba(255,255,255,0.4);
}

.app-icon img, .app-icon svg {
    width: 48px;
    height: 48px;
    object-fit: contain;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
}

.app-name {
    margin-top: 12px;
    font-size: 14px;
    font-weight: 500;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    opacity: 0.9;
}

.lock .app-icon::after { content: "🔒"; position: absolute; top: 5px; right: 5px; font-size: 12px; opacity: 0.7; }

.section-header {
    grid-column: 1 / -1;
    margin-top: 15px;
    margin-bottom: 5px;
    padding-left: 10px;
    font-size: 18px;
    font-weight: 600;
    opacity: 0.9;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    border-left: 4px solid #fff;
    line-height: 1.2;
}

/* --- 5. 底部 GitHub 信息 --- */
.footer-container {
    margin-top: auto;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px 0;
    z-index: 1;
    animation: fadeIn 1s ease 0.8s backwards;
}

.github-capsule {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    padding: 10px 24px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.85);
    font-weight: 500;
    font-size: 15px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.github-capsule:hover {
    background: var(--card-hover);
    color: #fff;
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    border-color: rgba(255, 255, 255, 0.3);
}

.github-icon {
    width: 20px;
    height: 20px;
    fill: currentColor;
}

/* 动画定义 */
@keyframes dropDown { from { opacity:0; transform:translateY(-40px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideUp { from { opacity:0; transform:translateY(50px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes slideUpFade { 
    0% { opacity: 0.5; transform: translateY(15px); } 
    100% { opacity: 1; transform: translateY(0); } 
}

/* 移动端适配 */
@media (max-width: 600px) {
    .header-info { margin-top: 8vh; font-size: 16px; flex-direction: column; gap: 5px; }
    .clock-container { font-size: 52px; letter-spacing: -1px; } 
    .clock-colon { margin: 0 1px; }
    .main-grid { grid-template-columns: repeat(4, 1fr); gap: 20px 10px; padding-bottom: 40px; }
    .app-icon { width: 64px; height: 64px; }
    .app-icon img { width: 32px; height: 32px; }
    .footer-container { padding-bottom: 30px; }
}
</style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video" poster="https://bing.img.run/1920x1080.php">
        <source src="https://cdn.pixabay.com/video/2021/08/04/83897-583204368_large.mp4" type="video/mp4">

<script>
    /* 1. 图标加载逻辑 */
    document.querySelectorAll('.favicon').forEach(img => {
        const domain = img.getAttribute('data-domain');
        img.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
        img.onerror = function() {
            this.parentNode.innerHTML = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>';
        };
    });

    /* 2. 时钟与问候 */
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        document.getElementById('clock-hours-min').textContent = `${hours}:${minutes}`;
        
        const secEl = document.getElementById('clock-seconds');
        if(secEl.textContent !== seconds) {
            secEl.textContent = seconds;
            secEl.classList.remove('tick-anim');
            void secEl.offsetWidth; 
            secEl.classList.add('tick-anim');
        }

        const hour = now.getHours();
        let greetingText = "Hello";
        if (hour >= 5 && hour < 12) greetingText = "Good Morning";
        else if (hour >= 12 && hour < 18) greetingText = "Good Afternoon";
        else greetingText = "Good Evening";
        document.getElementById('greeting').textContent = greetingText;

        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('date').textContent = now.toLocaleDateString('zh-CN', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* 3. 天气获取 */
    async function fetchWeather() {
        const weatherBadge = document.getElementById('weather-badge');
        const weatherText = document.getElementById('weather-text');
        const weatherIcon = document.getElementById('weather-icon');
        try {
            const geoRes = await fetch('https://get.geojs.io/v1/ip/geo.json');
            const geoData = await geoRes.json();
            const { city, latitude, longitude } = geoData;
            const weatherRes = await fetch(
                `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`
            );
            const weatherData = await weatherRes.json();
            const current = weatherData.current_weather;
            let icon = '🌤️'; 
            const code = current.weathercode;
            if (code === 0) icon = '☀️';
            else if (code >= 1 && code <= 3) icon = '☁️';
            else if (code >= 45 && code <= 48) icon = '🌫️';
            else if (code >= 51 && code <= 67) icon = '🌧️';
            else if (code >= 71 && code <= 77) icon = '❄️';
            else if (code >= 95) icon = '⛈️';
            weatherIcon.textContent = icon;
            weatherText.textContent = `${city} ${Math.round(current.temperature)}°C`;
            weatherBadge.style.display = 'flex';
        } catch (error) {
            console.error("Weather fetch failed:", error);
            weatherBadge.style.display = 'none';
        }
    }
    fetchWeather();

    document.addEventListener("keydown", e => {
        if(e.key === "/" && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            document.querySelector('.search-input').focus();
        }
    });
</script>
